name: Production Uptime

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-uptime
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check homepage
        run: curl --fail --silent --show-error --retry 2 --retry-all-errors --max-time 20 https://symbolicdev.com/ > /dev/null
      - name: Check sitemap
        run: curl --fail --silent --show-error --retry 2 --retry-all-errors --max-time 20 https://symbolicdev.com/sitemap.xml > /dev/null
      - name: Check contact delivery configuration
        run: curl --fail --silent --show-error --retry 2 --retry-all-errors --max-time 20 https://symbolicdev.com/api/health
